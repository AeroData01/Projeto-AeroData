<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Gerencial Completo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body onload="validarSessao()">
  <aside class="sidebar">
    <div class="icon">
      <a href="../dashboard/funcionario.html" title="Adicionar funcionário"><i class="fa-solid fa-user-plus"></i></a>
    </div>
    <div class="icon" style="height: 675px;">
      <a href="../dashboard/feedback.html" title="Gerenciar feedbacks"><i class="fa-solid fa-face-laugh-beam"></i></a>
    </div>
    <div class="sidebar-bottom">
      <a onclick="limparSessao()" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></a>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="user-info">
        <img src="../assets/ícone-conta.svg" alt="Ícone Conta" />
        <span id="b_usuario"></span>
      </div>
    </header>

    <!-- KPIs -->
    <section class="stats">
      <div class="card">
        <h4>Total de Voos</h4>
        <h3 id="kpiTotalVoos"></h3>
      </div>
      <div class="card">
        <h4>Taxa de Voos Atrasados</h4>
        <h3 id="kpiTaxaAtraso"></h3>
        <h4 id="kpiTotalAtrasos"></h4>
      </div>
      <div class="card">
        <h4>Taxa de Cancelamentos</h4>
        <h3 id="kpiTaxaCancelamento"></h3>
        <h4 id="kpiTotalCancelados"></h4>
      </div>
      <div class="card">
        <h4>Rota com Mais Atrasos</h4>
        <h3 id="kpiRotaMaisAtrasos"></h3>
        <h4 id="kpiTotalAtrasosNaMaisAtrasada"></h4>
      </div>
    </section>

    <!-- Gráficos -->
    <section class="charts">
      <div class="chart-card"><canvas id="chartAtrasoMedio"></canvas></div>
      <div class="chart-card"><canvas id="chartCancelamentosMensais"></canvas></div>
      <div class="chart-card"><canvas id="chartAtrasosMensais"></canvas></div>
      <div class="chart-card"><canvas id="chartDistribuicaoCompanhias"></canvas></div>
      <!-- Gráfico 5 com layout especial -->
      <!-- <div class="chart-card wide"><canvas id="chartComparativo"></canvas></div> -->
    </section>
  </main>

  <!-- Scripts dos gráficos -->
  <script src="js/dash-gerencial.js"></script>
  <script src="../js/sessao.js"></script>
</body>
</html>
