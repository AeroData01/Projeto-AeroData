<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Analytics</title>

  <link rel="stylesheet" href="styles.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="icon" href="../assets/TechMentor-Logo.ico" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>

<body>

  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="alerta.html" class="icon" title="Alertas"><i class="bx bx-bell"></i></a>
    </div>
    <div class="sidebar-bottom">
      <a href="../index.html" class="icon" id="logout-icon" title="Sair"><i class="bx bx-log-out"></i></a>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="user-info">
        <img src="../assets/ícone-conta.svg" alt="Ícone Conta" />
        <span>Vagner Silva</span>
      </div>
    </header>

    <section class="stats">
      <div class="card">
        Total de Voos
        <h3>17.780</h3>
      </div>
      <div class="card">
        Taxa de Voos Atrasados
        <h3>21.52%</h3>
        <h4>(3.820 voos atrasados)</h4>
      </div>
      <div class="card">
        Taxa de Cancelamentos
        <h3>11.19%</h3>
        <h4>(2.236 voos cancelados)</h4>
      </div>
      <div class="card">
        Rota com Mais Atrasos
        <h3>CHG-SDU</h3>
        <h4>(1.444 atrasos)</h4>
      </div>
      <div class="card">
        Rota com Mais Cancelamentos
        <h3>SDU-CGH</h3>
        <h4>(1.006 cancelamentos)</h4>
      </div>
    </section>

    <section class="charts">
      <div class="chart-card">
        <canvas id="chartAtrasoMedio"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="chartCancelamentosMensais"></canvas>
      </div>
      <div class="chart-card">
        <canvas id="chartAtrasosMensais"></canvas>
      </div>
    </section>

    <!-- Novo layout de linha + rosca -->
    <section class="chart-row-comparativo">
      <div class="chart-card chart-pie">
        <canvas id="chartDistribuicaoCompanhias"></canvas>
      </div>
      <div class="chart-card chart-line">
        <canvas id="chartComparativo"></canvas>
      </div>
    </section>
  </main>

  <script>
    // Gráfico 1: Top 3 companhias com mais atrasos
    new Chart(document.getElementById('chartAtrasoMedio'), {
      type: 'bar',
      data: {
        labels: ['Gol', 'Latam', 'Azul'],
        datasets: [
          { label: '2023', data: [22, 18, 17], backgroundColor: '#1E40AF' },
          { label: '2024', data: [20, 19, 16], backgroundColor: '#60A5FA' },
          { label: '2025', data: [19, 17, 15], backgroundColor: '#93C5FD' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Top 3 Companhias com Mais Atrasos (%) por Ano',
            font: { size: 18, weight: 'bold' }
          },
          legend: { position: 'top' }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Taxa de Atrasos (%)' }
          }
        }
      }
    });

    // Gráfico 2: Cancelamentos por mês
    new Chart(document.getElementById('chartCancelamentosMensais'), {
      type: 'bar',
      data: {
        labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
        datasets: [
          { label: '2023', data: [90, 80, 70, 60, 85, 100, 110, 120, 130, 100, 90, 95], backgroundColor: '#EF4444' },
          { label: '2024', data: [80, 70, 60, 50, 75, 90, 100, 110, 115, 95, 85, 90], backgroundColor: '#F87171' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Cancelamentos por Mês - 2023 vs 2024',
            font: { size: 18, weight: 'bold' }
          },
          legend: { position: 'top' }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Cancelamentos' }
          }
        }
      }
    });

    // Gráfico 3: Atrasos por mês
    new Chart(document.getElementById('chartAtrasosMensais'), {
      type: 'bar',
      data: {
        labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
        datasets: [
          { label: '2023', data: [120, 130, 140, 100, 110, 90, 130, 140, 150, 160, 170, 180], backgroundColor: '#F59E0B' },
          { label: '2024', data: [110, 120, 130, 95, 100, 85, 120, 130, 140, 150, 160, 165], backgroundColor: '#FCD34D' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Atrasos por Mês - 2023 vs 2024',
            font: { size: 18, weight: 'bold' }
          },
          legend: { position: 'top' }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Atrasos' }
          }
        }
      }
    });

    // Gráfico 4: Rosca - Participação SP-RJ
    new Chart(document.getElementById('chartDistribuicaoCompanhias'), {
      type: 'doughnut',
      data: {
        labels: ['Gol', 'Latam', 'Azul'],
        datasets: [{
          data: [45, 35, 20],
          backgroundColor: ['#DC2626', '#1D4ED8', '#3B82F6']
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Participação no Mercado – Voos SP-RJ',
            font: { size: 18 }
          },
          legend: { position: 'bottom' },
          datalabels: {
            formatter: (value, context) => {
              const total = context.chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
              return ((value / total) * 100).toFixed(1) + '%';
            },
            color: '#fff',
            font: { weight: 'bold', size: 14 }
          }
        }
      },
      plugins: [ChartDataLabels]
    });

    // Gráfico 5: Comparativo de Voos (linha)
    new Chart(document.getElementById('chartComparativo'), {
      type: 'line',
      data: {
        labels: ['Gol', 'Latam', 'Azul'],
        datasets: [
          {
            label: 'Voos Cancelados',
            data: [120, 150, 90],
            borderColor: '#DC2626',
            backgroundColor: '#DC2626',
            fill: false,
            tension: 0.3
          },
          {
            label: 'Voos',
            data: [1000, 1200, 1100],
            borderColor: '#1E3A8A',
            backgroundColor: '#1E3A8A',
            fill: false,
            tension: 0.3
          },
          {
            label: 'Voos Atrasados',
            data: [210, 250, 180],
            borderColor: '#F59E0B',
            backgroundColor: '#F59E0B',
            fill: false,
            tension: 0.3
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: {
            display: true,
            text: 'Comparativo de Voos por Companhia Aérea',
            font: { size: 18, weight: 'bold' }
          },
          legend: { position: 'top' }
        },
        scales: {
          y: {
            beginAtZero: true,
            title: { display: true, text: 'Número de Voos' }
          },
          x: {
            title: { display: true, text: 'Companhia Aérea' }
          }
        }
      }
    });
  </script>

</body>

</html>
