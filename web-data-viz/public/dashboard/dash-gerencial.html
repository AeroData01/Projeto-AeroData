<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Gerencial Completo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="#" title="Alerta">🔔</a>
    </div>
    <div class="sidebar-bottom">
      <a href="../dashboard/funcionario.html" title="Adicionar funcionário"><img src="../assets/icon/icone-add-funcionario.png" alt=""></a>
      <a href="#" title="Sair">⏻</a>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="user-info">
        <img src="https://via.placeholder.com/36" alt="Ícone Conta" />
        <span id="b_usuario"></span>
      </div>
    </header>

    <!-- KPIs -->
    <section class="stats">
      <div class="card">
        <h4>Total de Voos</h4>
        <h3>17.780</h3>
      </div>
      <div class="card">
        <h4>Taxa de Voos Atrasados</h4>
        <h3>21.52%</h3>
        <h4>(3.820 voos)</h4>
      </div>
      <div class="card">
        <h4>Taxa de Cancelamentos</h4>
        <h3>11.19%</h3>
        <h4>(2.236 voos)</h4>
      </div>
      <div class="card">
        <h4>Rota com Mais Atrasos</h4>
        <h3>CHG-SDU</h3>
        <h4>(1.444 atrasos)</h4>
      </div>
    </section>

    <!-- Gráficos -->
    <section class="charts">
      <div class="chart-card"><canvas id="chartAtrasoMedio"></canvas></div>
      <div class="chart-card"><canvas id="chartCancelamentosMensais"></canvas></div>
      <div class="chart-card"><canvas id="chartAtrasosMensais"></canvas></div>
      <div class="chart-card"><canvas id="chartDistribuicaoCompanhias"></canvas></div>
      <!-- Gráfico 5 com layout especial -->
      <div class="chart-card wide"><canvas id="chartComparativo"></canvas></div>
    </section>
  </main>

  <!-- Scripts dos gráficos -->
  <script src="js/dash-gerencial.js"></script>
  <script src="../js/sessao.js"></script>
</body>
</html>
