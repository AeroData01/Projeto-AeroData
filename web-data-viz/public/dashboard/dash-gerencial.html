<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Gerencial Completo</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <aside class="sidebar">
    <div class="sidebar-top">
      <a href="#" title="Alerta">🔔</a>
    </div>
    <div class="sidebar-bottom">
      <a href="#" title="Sair">⏻</a>
    </div>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <div class="user-info">
        <img src="https://via.placeholder.com/36" alt="Ícone Conta" />
        <span>Vagner Silva</span>
      </div>
    </header>

    <!-- KPIs -->
    <section class="stats">
      <div class="card">
        <h4>Total de Voos</h4>
        <h3>17.780</h3>
      </div>
      <div class="card">
        <h4>Taxa de Voos Atrasados</h4>
        <h3>21.52%</h3>
        <h4>(3.820 voos)</h4>
      </div>
      <div class="card">
        <h4>Taxa de Cancelamentos</h4>
        <h3>11.19%</h3>
        <h4>(2.236 voos)</h4>
      </div>
      <div class="card">
        <h4>Rota com Mais Atrasos</h4>
        <h3>CHG-SDU</h3>
        <h4>(1.444 atrasos)</h4>
      </div>
    </section>

    <!-- Gráficos -->
    <section class="charts">
      <div class="chart-card"><canvas id="chartAtrasoMedio"></canvas></div>
      <div class="chart-card"><canvas id="chartCancelamentosMensais"></canvas></div>
      <div class="chart-card"><canvas id="chartAtrasosMensais"></canvas></div>
      <div class="chart-card"><canvas id="chartDistribuicaoCompanhias"></canvas></div>
      <!-- Gráfico 5 com layout especial -->
      <div class="chart-card wide"><canvas id="chartComparativo"></canvas></div>
    </section>
  </main>

  <!-- Scripts dos gráficos -->
  <script>
    // Gráfico 1 – Atraso médio
    new Chart(document.getElementById('chartAtrasoMedio'), {
      type: 'bar',
      data: {
        labels: ['Gol', 'Latam', 'Azul'],
        datasets: [
          { label: '2023', data: [22, 18, 17], backgroundColor: '#1E40AF' },
          { label: '2024', data: [20, 19, 16], backgroundColor: '#60A5FA' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: 'Top 3 Companhias com Mais Atrasos (%) por Ano' },
          legend: { position: 'top' }
        },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Taxa de Atrasos (%)' } }
        }
      }
    });

    // Gráfico 2 – Cancelamentos mensais
    new Chart(document.getElementById('chartCancelamentosMensais'), {
      type: 'bar',
      data: {
        labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
        datasets: [
          { label: '2023', data: [90, 80, 70, 60, 85, 100, 120, 110, 105, 100, 95, 85], backgroundColor: '#EF4444' },
          { label: '2024', data: [80, 70, 60, 50, 75, 90, 110, 100, 95, 90, 85, 75], backgroundColor: '#F87171' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: 'Cancelamentos por Mês - 2023 vs 2024' },
          legend: { position: 'top' }
        },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Cancelamentos' } }
        }
      }
    });

    // Gráfico 3 – Atrasos mensais
    new Chart(document.getElementById('chartAtrasosMensais'), {
      type: 'bar',
      data: {
        labels: ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'],
        datasets: [
          { label: '2023', data: [120, 130, 115, 140, 110, 100, 130, 125, 140, 150, 160, 170], backgroundColor: '#F59E0B' },
          { label: '2024', data: [110, 120, 105, 130, 100, 90, 120, 115, 130, 140, 150, 160], backgroundColor: '#FCD34D' }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: 'Atrasos por Mês - 2023 vs 2024' },
          legend: { position: 'top' }
        },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Atrasos' } }
        }
      }
    });

    // Gráfico 4 – Rosca
    new Chart(document.getElementById('chartDistribuicaoCompanhias'), {
      type: 'doughnut',
      data: {
        labels: ['Gol', 'Latam', 'Azul'],
        datasets: [{
          data: [45, 35, 20],
          backgroundColor: ['#3B82F6', '#EF4444', '#10B981']
        }]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: 'Participação no Mercado – SP-RJ' },
          legend: { position: 'bottom' }
        }
      }
    });

    // Gráfico 5 – Comparativo de voos
    new Chart(document.getElementById('chartComparativo'), {
      type: 'line',
      data: {
        labels: ['Gol', 'Latam', 'Azul'],
        datasets: [
          {
            label: 'Voos Cancelados',
            data: [120, 150, 90],
            borderColor: '#DC2626',
            backgroundColor: '#DC2626',
            fill: false,
            tension: 0.3
          },
          {
            label: 'Voos',
            data: [1000, 1200, 1100],
            borderColor: '#1E3A8A',
            backgroundColor: '#1E3A8A',
            fill: false,
            tension: 0.3
          },
          {
            label: 'Voos Atrasados',
            data: [210, 250, 180],
            borderColor: '#F59E0B',
            backgroundColor: '#F59E0B',
            fill: false,
            tension: 0.3
          }
        ]
      },
      options: {
        responsive: true,
        plugins: {
          title: { display: true, text: 'Comparativo de Voos por Companhia' },
          legend: { position: 'top' }
        },
        scales: {
          y: { beginAtZero: true, title: { display: true, text: 'Voos' } },
          x: { title: { display: true, text: 'Companhias' } }
        }
      }
    });
  </script>
</body>
</html>
