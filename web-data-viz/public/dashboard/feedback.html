<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body onload="listarObservacao()">
  <aside class="sidebar">
    <div class="sidebar-top">
      <a onclick="voltar()" title="Voltar" style="cursor: pointer;"><i class="fa-solid fa-circle-arrow-left"></i></a>
    </div>
  </aside>

  <div id="modalNovoFuncionario" class="modal-novo-funcionario">
    <div class="conteudo-novo-funcionario">

      <div class="modal-header">
        <span onclick="fecharModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" class="bi bi-x-lg"
            viewBox="0 0 16 16">
            <path
              d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z" />
          </svg>
        </span>
        <h1>Insira as informações do feedback</h1>
      </div>

      <div >
        <div class="div-linha-novo-funcionario">
          <label for="inputNovaNota"><b>Nota</b></label>
          <input type="number" max="10" min="0" id="inputNovaNota" placeholder="Insira a nota do feedback">
        </div>

        <div class="div-linha-novo-funcionario">
          <label for="inputNovaInformacao"><b>Informação</b></label>
          <input type="text" id="inputNovaInformacao" placeholder="Dê uma descrição pra sua nota">
        </div>
      </div>

        <div id="divMensagem"></div>

        <button class="botao-novo-funcionario" onclick="cadastrarObservacao()">Cadastrar</button>
      </div>
    </div>
  </div>

  <div class="container-conteudo">
    <div class="div-conteudo">
      <div class="div-texto funcionario">
        <h1>Feedbacks</h1>
        <p>Gerencie e cadastre seus feedbacks por aqui!</p>
        <button onclick="novoFuncionario()" class="botao-novo-funcionario">
          Novo feedback
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-plus-square"
            viewBox="0 0 16 16">
            <path
              d="M14 1a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1zM2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2z" />
            <path
              d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4" />
          </svg>
        </button>
      </div>

      <div class="div-texto tabela" id="div_tabela">
        <div class="div-tabela">
          <table class="tabela-funcionarios">
            <tbody id="tbody_tabela"></tbody>
          </table>
        </div>
      </div>

      <div id="div_modals"></div>
    </div>
  </div>
  </div>

</body>

</html>

<script src="./js/feedback.js"></script>
