<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard SP e RJ - Operações</title>
  <link rel="stylesheet" href="styles.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>

<body class="dash-operacional">
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="icon" title="Sair">
          <a onclick="limparSessao()">⏻</a>
        </div>
        <br>
        <div class="icon">
          <a href="./observacao.html" title="Observações"><img src="../assets/icon/icone-bloco-de-anotacoes2.png" width="30px" height="30px"></a>
        </div>
      </div>
    </aside>
 
    <main class="main-content">
      <header class="top-bar">
        <div class="user-info">
          <img src="../assets/ícone-conta.svg" alt="Conta">
          <span id="b_usuario"></span>
        </div>
      </header>

      <section class="stats">
        <div class="card">Rota com mais atraso<h3>Latam</h3><h4>(2.301 atrasos)</h4></div>
        <div class="card">Rota com mais cancelamento<h3>Gol</h3><h4>(1.754 cancelamentos)</h4></div>
        <div class="card">Aeroporto com mais atraso<h3>91,2%</h3></div>
        <div class="card">Aeroporto com mais cancelamento<h3>Latam: 45% • Gol: 35% • Azul: 20%</h3></div>
        <div class="card">Pontualidade em % da companhia Aerea<h3>Latam: 45% • Gol: 35% • Azul: 20%</h3></div>
      </section>

      <section class="charts" style="gap: 1.5rem; margin-top: 2rem;">
        <div class="chart-card">
          <canvas id="donutChart" style="height: 200px !important;"></canvas>
        </div>

        <div class="chart-card">
          <canvas id="lineChartAtrasos" width="600" height="500"></canvas>
        </div>

        <div class="chart-card">
          <canvas id="lineChartCancelamentos" width="1000" height="800"></canvas>
        </div>

        <div class="chart-card wide" style="max-width: 1000px; margin: 0 auto;">
          <canvas id="barChartCompanhias"></canvas>
        </div>
      </section>
    </main>
  </div>

  <script src="./js/dash-operacional.js"></script>
  <script src="../js/sessao.js"></script>

</body>
</html>
